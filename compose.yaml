name: labportalen
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /data/labportalen.sqlite3
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:8000"
    volumes:
      - labportalen-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
volumes:
  labportalen-data:
